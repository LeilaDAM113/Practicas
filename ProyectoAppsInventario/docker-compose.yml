services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventario}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://inventario:${DB_PASSWORD:-inventario}@db:5432/inventario
      TENANT_ID: ${TENANT_ID:-621db785-00d7-4ced-b451-0f5696381174}
      API_CLIENT_ID: ${API_CLIENT_ID:-03b4dd03-4c2d-4995-b4fb-0ba2c5a94a9a}
      MODO_PRUEBA: "false"
    depends_on:
      - db
    restart: unless-stopped
    profiles: ["completo"]

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
    profiles: ["completo"]

volumes:
  pgdata: