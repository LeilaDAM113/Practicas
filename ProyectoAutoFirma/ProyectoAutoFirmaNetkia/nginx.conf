server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    #Si recargas /mi-firma o /redirect, devuelve la app 
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
