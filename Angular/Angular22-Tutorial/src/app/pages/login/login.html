<div class="flex justify-center items-center min-h-[80vh] bg-gray-100">
    <!-- <ol class="list-decimal font-mono text-3xl">
        <li>Eager Loading</li>
         <li>Lazy Loading</li>
          <li>Preloading</li>
    </ol> -->
    <div class="w-full max-w-xl bg-white border border-gray-300 rounded-xl p-6 shadow">
        <h2 class="text-3xl font-bold text-gray-900 mb-6"> Login </h2>
        <input type="text" placeholder="Username" class="w-full border border-gray-300 rounded-lg px-2 py-2 text-2xl outline-none focus:ring-2 focus:ring-blue-500 mb-8">
        <input type="password" placeholder="Password" class="w-full border border-gray-300  rounded-lg px-2 py-2 text-2xl outline-none focus:ring-2 focus:ring-blue-500 mb-8">
        <div class="flex justify-center gap-4">
            <button class="w-60 bg-blue-600 hover:bg-blue-700 text-white text-2xl font-semibold py-2 rounded-lg transition" (click)="onLogin()">
                Login
            </button>
              <button class="w-60 bg-blue-600 hover:bg-blue-700 text-white text-2xl font-semibold py-2 rounded-lg transition" (click)="onRegister()">
                Register
            </button>
        </div>
    </div>
</div>
